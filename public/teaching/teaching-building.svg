<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151A"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D7DCE2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292D33" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9299A3" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad2)"/>
  <rect width="100%" height="100%" fill="url(#grid2)"/>
  <rect width="100%" height="100%" fill="url(#dots2)"/>
  <circle cx="600" cy="400" r="380" fill="url(#glow2)"/>

  <!-- Frame -->
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="none" stroke="#292D33" stroke-width="1.5"/>
  <rect x="52" y="52" width="1096" height="696" rx="10" fill="none" stroke="#D7DCE2" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Top Badges -->
  <g font-family="monospace" font-size="11" fill="#9299A3" letter-spacing="2">
    <text x="70" y="80">02 // WORKSHOP // HARDWARE_LAB</text>
    <text x="940" y="80">BENCH POWER: 3.3V / 5.0V</text>
  </g>
  <line x1="70" y1="95" x2="1130" y2="95" stroke="#292D33" stroke-width="1"/>

  <!-- Left: Dev Board Schematic & Pinout -->
  <g transform="translate(110, 160)">
    <!-- Microcontroller Board -->
    <rect x="0" y="0" width="360" height="460" rx="12" fill="#12151A" stroke="#292D33" stroke-width="2"/>
    <rect x="8" y="8" width="344" height="444" rx="8" fill="none" stroke="#D7DCE2" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Mounting Holes -->
    <circle cx="24" cy="24" r="10" fill="#08090B" stroke="#D7DCE2" stroke-width="1"/>
    <circle cx="336" cy="24" r="10" fill="#08090B" stroke="#D7DCE2" stroke-width="1"/>
    <circle cx="24" cy="436" r="10" fill="#08090B" stroke="#D7DCE2" stroke-width="1"/>
    <circle cx="336" cy="436" r="10" fill="#08090B" stroke="#D7DCE2" stroke-width="1"/>

    <!-- Main MCU SoC -->
    <rect x="90" y="140" width="180" height="180" rx="6" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
    <text x="180" y="210" font-family="monospace" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">TARGET_MCU</text>
    <text x="180" y="235" font-family="monospace" font-size="10" fill="#9299A3" text-anchor="middle">240MHz DUAL-CORE</text>
    <text x="180" y="255" font-family="monospace" font-size="9" fill="#D7DCE2" text-anchor="middle">[LIVE DEBUG ACTIVE]</text>

    <!-- Pin Headers Left & Right -->
    <g fill="#08090B" stroke="#9299A3" stroke-width="1">
      <rect x="12" y="60" width="16" height="12" rx="2"/>
      <rect x="12" y="90" width="16" height="12" rx="2"/>
      <rect x="12" y="120" width="16" height="12" rx="2"/>
      <rect x="12" y="150" width="16" height="12" rx="2"/>
      <rect x="12" y="180" width="16" height="12" rx="2"/>
      <rect x="12" y="210" width="16" height="12" rx="2"/>
      <rect x="12" y="240" width="16" height="12" rx="2"/>
      <rect x="12" y="270" width="16" height="12" rx="2"/>
      <rect x="12" y="300" width="16" height="12" rx="2"/>
      <rect x="12" y="330" width="16" height="12" rx="2"/>
      <rect x="12" y="360" width="16" height="12" rx="2"/>
      <rect x="12" y="390" width="16" height="12" rx="2"/>

      <rect x="332" y="60" width="16" height="12" rx="2"/>
      <rect x="332" y="90" width="16" height="12" rx="2"/>
      <rect x="332" y="120" width="16" height="12" rx="2"/>
      <rect x="332" y="150" width="16" height="12" rx="2"/>
      <rect x="332" y="180" width="16" height="12" rx="2"/>
      <rect x="332" y="210" width="16" height="12" rx="2"/>
      <rect x="332" y="240" width="16" height="12" rx="2"/>
      <rect x="332" y="270" width="16" height="12" rx="2"/>
      <rect x="332" y="300" width="16" height="12" rx="2"/>
      <rect x="332" y="330" width="16" height="12" rx="2"/>
      <rect x="332" y="360" width="16" height="12" rx="2"/>
      <rect x="332" y="390" width="16" height="12" rx="2"/>
    </g>

    <!-- USB-C Port -->
    <rect x="135" y="-8" width="90" height="20" rx="4" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
  </g>

  <!-- Probe Interconnect Lines -->
  <path d="M 470 250 C 530 250, 520 220, 560 220" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 470 310 C 530 310, 520 340, 560 340" fill="none" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 470 370 C 530 370, 530 460, 560 460" fill="none" stroke="#9299A3" stroke-width="1.5"/>

  <!-- Right: Digital Oscilloscope & Logic Analyzer -->
  <g transform="translate(560, 160)">
    <rect x="0" y="0" width="530" height="460" rx="12" fill="#12151A" stroke="#292D33" stroke-width="2"/>
    <rect x="8" y="8" width="514" height="444" rx="8" fill="none" stroke="#D7DCE2" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Screen Bezel -->
    <rect x="25" y="25" width="480" height="280" rx="6" fill="#08090B" stroke="#292D33" stroke-width="1.5"/>

    <!-- Oscilloscope Grid -->
    <g stroke="#292D33" stroke-width="0.75" stroke-dasharray="3 3">
      <line x1="25" y1="95" x2="505" y2="95"/>
      <line x1="25" y1="165" x2="505" y2="165"/>
      <line x1="25" y1="235" x2="505" y2="235"/>
      <line x1="121" y1="25" x2="121" y2="305"/>
      <line x1="217" y1="25" x2="217" y2="305"/>
      <line x1="313" y1="25" x2="313" y2="305"/>
      <line x1="409" y1="25" x2="409" y2="305"/>
    </g>

    <!-- Channel 1: Clean Square Clock Signal (PWM / Clock) -->
    <path d="M 40 120 L 80 120 L 80 70 L 140 70 L 140 120 L 200 120 L 200 70 L 260 70 L 260 120 L 320 120 L 320 70 L 380 70 L 380 120 L 440 120 L 440 70 L 490 70"
          fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Channel 2: Sine / Analog Sensor Signal Waveform -->
    <path d="M 40 235 Q 70 185 100 235 T 160 235 T 220 235 T 280 235 T 340 235 T 400 235 T 460 235 T 490 235"
          fill="none" stroke="#D7DCE2" stroke-width="2"/>

    <!-- O-Scope Telemetry Overlay -->
    <g font-family="monospace" font-size="10" fill="#9299A3">
      <text x="40" y="48">CH1: 3.3Vpp  FREQ: 400.0kHz [I2C CLK]</text>
      <text x="320" y="48">CH2: 1.65Vpk  SAMP: 10MS/s</text>
    </g>

    <!-- Lower Controls Row -->
    <g transform="translate(25, 335)">
      <!-- Rotary Knobs -->
      <g transform="translate(40, 45)">
        <circle cx="0" cy="0" r="26" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="0" y2="-18" stroke="#FFFFFF" stroke-width="2"/>
        <text x="0" y="42" font-family="monospace" font-size="9" fill="#9299A3" text-anchor="middle">VOLT/DIV</text>
      </g>
      <g transform="translate(140, 45)">
        <circle cx="0" cy="0" r="26" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="14" y2="-14" stroke="#FFFFFF" stroke-width="2"/>
        <text x="0" y="42" font-family="monospace" font-size="9" fill="#9299A3" text-anchor="middle">TIME/DIV</text>
      </g>
      <!-- Mode Badges -->
      <rect x="230" y="20" width="100" height="30" rx="4" fill="#08090B" stroke="#292D33" stroke-width="1"/>
      <text x="280" y="39" font-family="monospace" font-size="10" fill="#D7DCE2" text-anchor="middle">TRIGGER: AUTO</text>
      <rect x="350" y="20" width="110" height="30" rx="4" fill="#08090B" stroke="#FFFFFF" stroke-width="1"/>
      <text x="405" y="39" font-family="monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">RUN / STOP</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <g transform="translate(70, 715)">
    <text font-family="monospace" font-size="12" fill="#FFFFFF" font-weight="bold">HANDS-ON WORKSHOP BENCHMARK</text>
    <text x="0" y="18" font-family="sans-serif" font-size="11" fill="#9299A3">Understanding signals, microcontrollers, and protocols through practical experimentation.</text>
    <text x="830" y="10" font-family="monospace" font-size="11" fill="#D7DCE2">[HARDWARE WORKSHOP ACTIVE]</text>
  </g>
</svg>
