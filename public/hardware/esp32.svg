<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292D33" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9299A3" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- PCB Outline -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="520" height="680" rx="16" fill="#12151A" stroke="#292D33" stroke-width="2"/>
    <rect x="8" y="8" width="504" height="664" rx="12" fill="none" stroke="#D7DCE2" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Mounting Holes -->
    <circle cx="28" cy="28" r="14" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
    <circle cx="492" cy="28" r="14" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
    <circle cx="28" cy="652" r="14" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
    <circle cx="492" cy="652" r="14" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>

    <!-- Left Header Pins -->
    <g fill="#08090B" stroke="#9299A3" stroke-width="1">
      <rect x="18" y="70" width="24" height="18" rx="2"/>
      <rect x="18" y="100" width="24" height="18" rx="2"/>
      <rect x="18" y="130" width="24" height="18" rx="2"/>
      <rect x="18" y="160" width="24" height="18" rx="2"/>
      <rect x="18" y="190" width="24" height="18" rx="2"/>
      <rect x="18" y="220" width="24" height="18" rx="2"/>
      <rect x="18" y="250" width="24" height="18" rx="2"/>
      <rect x="18" y="280" width="24" height="18" rx="2"/>
      <rect x="18" y="310" width="24" height="18" rx="2"/>
      <rect x="18" y="340" width="24" height="18" rx="2"/>
      <rect x="18" y="370" width="24" height="18" rx="2"/>
      <rect x="18" y="400" width="24" height="18" rx="2"/>
      <rect x="18" y="430" width="24" height="18" rx="2"/>
      <rect x="18" y="460" width="24" height="18" rx="2"/>
      <rect x="18" y="490" width="24" height="18" rx="2"/>
      <rect x="18" y="520" width="24" height="18" rx="2"/>
      <rect x="18" y="550" width="24" height="18" rx="2"/>
      <rect x="18" y="580" width="24" height="18" rx="2"/>
    </g>

    <!-- Right Header Pins -->
    <g fill="#08090B" stroke="#9299A3" stroke-width="1">
      <rect x="478" y="70" width="24" height="18" rx="2"/>
      <rect x="478" y="100" width="24" height="18" rx="2"/>
      <rect x="478" y="130" width="24" height="18" rx="2"/>
      <rect x="478" y="160" width="24" height="18" rx="2"/>
      <rect x="478" y="190" width="24" height="18" rx="2"/>
      <rect x="478" y="220" width="24" height="18" rx="2"/>
      <rect x="478" y="250" width="24" height="18" rx="2"/>
      <rect x="478" y="280" width="24" height="18" rx="2"/>
      <rect x="478" y="310" width="24" height="18" rx="2"/>
      <rect x="478" y="340" width="24" height="18" rx="2"/>
      <rect x="478" y="370" width="24" height="18" rx="2"/>
      <rect x="478" y="400" width="24" height="18" rx="2"/>
      <rect x="478" y="430" width="24" height="18" rx="2"/>
      <rect x="478" y="460" width="24" height="18" rx="2"/>
      <rect x="478" y="490" width="24" height="18" rx="2"/>
      <rect x="478" y="520" width="24" height="18" rx="2"/>
      <rect x="478" y="550" width="24" height="18" rx="2"/>
      <rect x="478" y="580" width="24" height="18" rx="2"/>
    </g>

    <!-- RF Shield / SoC -->
    <rect x="110" y="80" width="300" height="280" rx="8" fill="#171B22" stroke="#D7DCE2" stroke-width="1.5"/>
    <text x="260" y="190" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="3">ESP32-WROOM-32D</text>
    <text x="260" y="225" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle" letter-spacing="1.5">2.4GHz Wi-Fi + BT 4.2 BLE</text>
    <text x="260" y="250" fill="#D7DCE2" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="1">DUAL-CORE XTENSA LX6</text>

    <!-- Meandering Antenna Pattern -->
    <path d="M 170 30 L 170 65 L 195 65 L 195 35 L 220 35 L 220 65 L 245 65 L 245 35 L 270 35 L 270 65 L 295 65 L 295 35 L 320 35 L 320 65 L 345 65" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Micro-USB / Type-C Connector -->
    <rect x="210" y="630" width="100" height="42" rx="4" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>

    <!-- Status LEDs and Crystals -->
    <rect x="140" y="420" width="40" height="24" rx="3" fill="#292D33" stroke="#D7DCE2" stroke-width="1"/>
    <circle cx="160" cy="432" r="4" fill="#FFFFFF"/>
    
    <rect x="340" y="420" width="40" height="24" rx="3" fill="#292D33" stroke="#D7DCE2" stroke-width="1"/>
    <circle cx="360" cy="432" r="4" fill="#FFFFFF"/>

    <!-- Bus Routing Traces -->
    <path d="M 110 220 L 42 220" stroke="#9299A3" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M 110 250 L 42 250" stroke="#9299A3" stroke-width="1.5"/>
    <path d="M 410 220 L 478 220" stroke="#9299A3" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M 410 250 L 478 250" stroke="#9299A3" stroke-width="1.5"/>
  </g>

  <!-- Technical Overlay Labels -->
  <text x="50" y="80" fill="#D7DCE2" font-family="'IBM Plex Mono', monospace" font-size="14" letter-spacing="2">BENCH // 01</text>
  <text x="50" y="105" fill="#9299A3" font-family="'Inter', sans-serif" font-size="12" letter-spacing="1">ESP32 REAL-TIME EMBEDDED COMPUTING</text>
</svg>

