<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292D33" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg3)"/>
  <rect width="100%" height="100%" fill="url(#grid3)"/>

  <!-- Technical Schematic: Ultrasonic & Multi-Sensor Breakout -->
  <g transform="translate(150, 200)">
    <!-- Main Sensor Substrate -->
    <rect x="0" y="80" width="500" height="480" rx="14" fill="#12151A" stroke="#292D33" stroke-width="2"/>
    <rect x="10" y="90" width="480" height="460" rx="10" fill="none" stroke="#D7DCE2" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Dual Transducer Barrels (Transmitter T & Receiver R) -->
    <g transform="translate(80, 160)">
      <circle cx="90" cy="90" r="80" fill="#171B22" stroke="#D7DCE2" stroke-width="2"/>
      <circle cx="90" cy="90" r="50" fill="#08090B" stroke="#9299A3" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="25" fill="#292D33" stroke="#FFFFFF" stroke-width="2"/>
      <text x="90" y="95" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">T</text>
    </g>

    <g transform="translate(260, 160)">
      <circle cx="90" cy="90" r="80" fill="#171B22" stroke="#D7DCE2" stroke-width="2"/>
      <circle cx="90" cy="90" r="50" fill="#08090B" stroke="#9299A3" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="25" fill="#292D33" stroke="#FFFFFF" stroke-width="2"/>
      <text x="90" y="95" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">R</text>
    </g>

    <!-- Transducer Sonic Waves -->
    <path d="M 170 120 A 120 120 0 0 0 170 30" fill="none" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 350 120 A 120 120 0 0 1 350 30" fill="none" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Signal Conditioning IC -->
    <rect x="190" y="380" width="120" height="70" rx="4" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
    <text x="250" y="420" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle" letter-spacing="1">ADC // I2C</text>

    <!-- Header Pins (VCC, TRIG, ECHO, GND) -->
    <g transform="translate(170, 500)">
      <circle cx="30" cy="30" r="8" fill="#08090B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="70" cy="30" r="8" fill="#08090B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="110" cy="30" r="8" fill="#08090B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="150" cy="30" r="8" fill="#08090B" stroke="#FFFFFF" stroke-width="1.5"/>

      <text x="30" y="55" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">VCC</text>
      <text x="70" y="55" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">TRIG</text>
      <text x="110" y="55" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">ECHO</text>
      <text x="150" y="55" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">GND</text>
    </g>
  </g>

  <!-- Technical Overlay Labels -->
  <text x="50" y="80" fill="#D7DCE2" font-family="'IBM Plex Mono', monospace" font-size="14" letter-spacing="2">BENCH // 03</text>
  <text x="50" y="105" fill="#9299A3" font-family="'Inter', sans-serif" font-size="12" letter-spacing="1">TRANSDUCERS & SENSOR BUS REGISTERS</text>
</svg>

