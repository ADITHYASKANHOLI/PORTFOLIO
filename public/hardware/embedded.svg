<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292D33" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg4)"/>
  <rect width="100%" height="100%" fill="url(#grid4)"/>

  <!-- Technical Schematic: Embedded Architecture & Bus Matrix -->
  <g transform="translate(150, 180)">
    <rect x="0" y="60" width="500" height="520" rx="14" fill="#12151A" stroke="#292D33" stroke-width="2"/>
    <rect x="10" y="70" width="480" height="500" rx="10" fill="none" stroke="#D7DCE2" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Central Processing Block -->
    <rect x="150" y="120" width="200" height="130" rx="6" fill="#171B22" stroke="#FFFFFF" stroke-width="2"/>
    <text x="250" y="175" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="bold" text-anchor="middle">MCU CORE</text>
    <text x="250" y="205" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">REGISTERS & ISR</text>

    <!-- Peripheral Modules -->
    <g transform="translate(50, 320)">
      <rect x="0" y="0" width="110" height="90" rx="6" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
      <text x="55" y="45" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">UART / SPI</text>
      <text x="55" y="68" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">SERIAL BUS</text>
    </g>

    <g transform="translate(195, 320)">
      <rect x="0" y="0" width="110" height="90" rx="6" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
      <text x="55" y="45" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">TIMERS</text>
      <text x="55" y="68" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">PWM COUNTERS</text>
    </g>

    <g transform="translate(340, 320)">
      <rect x="0" y="0" width="110" height="90" rx="6" fill="#08090B" stroke="#D7DCE2" stroke-width="1.5"/>
      <text x="55" y="45" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">GPIO</text>
      <text x="55" y="68" fill="#9299A3" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">INTERRUPTS</text>
    </g>

    <!-- Bus Lines -->
    <path d="M 250 250 L 250 320" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 105 285 L 395 285" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 105 285 L 105 320" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 395 285 L 395 320" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Telemetry Gateway Stream -->
    <g transform="translate(80, 460)">
      <rect x="0" y="0" width="340" height="60" rx="4" fill="#08090B" stroke="#292D33" stroke-width="1"/>
      <path d="M 20 30 L 320 30" stroke="#9299A3" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="170" y="35" fill="#D7DCE2" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">BI-DIRECTIONAL HARDWARE-SOFTWARE STREAM</text>
    </g>
  </g>

  <!-- Technical Overlay Labels -->
  <text x="50" y="80" fill="#D7DCE2" font-family="'IBM Plex Mono', monospace" font-size="14" letter-spacing="2">BENCH // 04</text>
  <text x="50" y="105" fill="#9299A3" font-family="'Inter', sans-serif" font-size="12" letter-spacing="1">FIRMWARE PIPELINES & HARDWARE BRIDGES</text>
</svg>

